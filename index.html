<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>孵小鸡模拟器</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <div id="top-bar">
        <span id="scene-name">主界面</span>
        <span id="level">等级：0</span>
        <span id="money">资金：0</span>
        <button id="bag-btn">背包</button>
        <button id="shop-btn">商店</button>
        <div id="system-menu-wrap" style="position: relative;">
          <button id="settings-btn">系统</button>
          <div id="system-menu" style="display: none; position: absolute; right: 0; top: 100%; background: #fffdf8; border: 1px solid #d8cfc0; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); min-width: 120px; z-index: 2000;">
            <button class="system-menu-item" id="load-btn" style="display: block; width: 100%; padding: 10px 16px; background: none; border: none; text-align: left; font-size: 14px;">读档</button>
            <button class="system-menu-item" id="new-game-btn" style="display: block; width: 100%; padding: 10px 16px; background: none; border: none; text-align: left; font-size: 14px;">开新游戏</button>
          </div>
        </div>
      </div>

      <div id="drag-layer"></div>

      <div id="toast" style="display: none"></div>

      <div id="scene-container">
        <div class="scene" id="hatch-scene">
          <h2>孵蛋场景</h2>
          <div
            id="hatch-grid"
            style="
              width: 100%;
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 20px;
              padding: 20vh 0 180vh 0;
              overflow-y: auto;
              min-height: 0;
              flex: 1;
              -webkit-overflow-scrolling: touch;
            "
          ></div>
        </div>

        <div class="scene" id="main-scene">
          <div id="main-status"></div>
          <div
            style="
              margin-top: 20px;
              display: flex;
              gap: 8px;
              align-items: center;
            "
          >
            <span>过</span>
            <input
              id="advance-days-input"
              type="number"
              min="1"
              value="1"
              style="width: 60px"
            />
            <span>天</span>
            <button id="advance-days-btn">确认</button>
          </div>
        </div>

        <div class="scene" id="brood-scene">
          <h2>育雏场景</h2>
          <div
            id="brood-grid"
            style="
              width: 100%;
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 20px;
              padding: 20vh 0 60vh 0;
              overflow-y: auto;
              min-height: 0;
              flex: 1;
              -webkit-overflow-scrolling: touch;
            "
          ></div>
        </div>

<div class="scene" id="life-scene">
          <h2>生活场景</h2>
          <div
            id="life-grid"
            style="
              width: 100%;
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 20px;
              padding: 20vh 0 240vh 0;
              overflow-y: auto;
              min-height: 0;
              flex: 1;
              -webkit-overflow-scrolling: touch;
            "
          ></div>
        </div>

      </div>
      <div id="shop-panel" style="display: none">
        <div class="shop-header">
          <span>商店</span>
          <button id="close-shop">关闭</button>
        </div>

        <div class="shop-tabs">
          <button class="tab-btn active" data-tab="egg">蛋</button>
          <button class="tab-btn" data-tab="chicken">鸡</button>
          <button class="tab-btn" data-tab="tool">工具</button>
        </div>

        <input
          class="search-input"
          id="shop-search"
          type="text"
          placeholder="搜索当前分类"
        />

        <div class="shop-content" id="shop-content">
          <!-- 商品列表会由 JavaScript 动态生成 -->
        </div>
      </div>
      <div id="bag-panel" style="display: none">
        <div class="shop-header">
          <span>背包</span>
          <div style="display: flex; justify-content: flex-end; gap: 8px">
            <button id="sell-bag-btn">售卖</button>
            <button id="close-bag">关闭</button>
          </div>
        </div>

        <div class="shop-tabs">
          <button class="tab-btn active" data-bag-tab="egg">鸡蛋</button>
          <button class="tab-btn" data-bag-tab="chick">小鸡</button>
          <button class="tab-btn" data-bag-tab="adultChicken">成年鸡</button>
          <button class="tab-btn" data-bag-tab="tool">工具</button>
        </div>

        <input
          class="search-input"
          id="bag-search"
          type="text"
          placeholder="搜索当前分类"
        />

        <div
          class="shop-content"
          id="bag-content"
          data-slot-id="bag"
          data-slot-type="bag"
        >
          <!-- 背包内容由 JavaScript 生成 -->
        </div>
<div id="sell-bar" style="padding: 12px 16px; border-top: 1px solid #e5ddd0; display: none; gap: 8px; align-items: center;">
          <span id="sell-count">已选 0 件</span>
          <span id="sell-total">合计 0 元</span>
          <button id="select-all-btn">全选</button>
          <button id="clear-all-btn">全不选</button>
          <span style="flex: 1;"></span>
          <button id="confirm-sell-btn">确认卖出</button>
        </div>
      </div>
      </div>
      <div id="bag-inspect" style="display: none">
        <img id="bag-inspect-img" src="" alt="" />
      </div>
      <div id="confirm-dialog" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(50, 45, 40, 0.45); align-items: center; justify-content: center; z-index: 2001;">
        <div style="background: #fffdf8; border-radius: 14px; padding: 24px 20px; max-width: 300px; width: 80%; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.12);">
          <div id="confirm-message" style="font-size: 15px; line-height: 1.6; margin-bottom: 20px;">确定要这么做吗？</div>
          <div style="display: flex; gap: 12px; justify-content: center;">
            <button id="confirm-ok-btn" style="padding: 8px 20px; border: 1px solid #8a8075; border-radius: 8px; background: #e8dfd0; font-size: 14px;">确定</button>
            <button id="confirm-cancel-btn" style="padding: 8px 20px; border: 1px solid #d8cfc0; border-radius: 8px; background: #f5f0e8; font-size: 14px;">取消</button>
          </div>
        </div>
      </div>
    </div>
    <script src="data.js"></script>
    <script src="main.js"></script>
  </body>
</html>
